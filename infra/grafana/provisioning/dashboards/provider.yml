apiVersion: 1

providers:
  - name: NIDS Dashboards
    orgId: 1
    folder: NIDS
    folderUid: nids-folder
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
